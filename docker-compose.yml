# Built on another machine and loaded here by deploy.sh; deploy-server.sh
# points the :current tags at the release before recreating anything. There is
# deliberately no `build:`: a build here is what ran this machine out of memory.
# Without one, a missing image would send compose to Docker Hub, so fail
# instead.
x-control-plane: &control-plane
  image: naru-pub-control-plane:current
  pull_policy: never
  # deploy.sh stops the slot that is not serving. `always` would bring it back
  # whenever the Docker daemon restarts; this leaves it stopped.
  restart: unless-stopped
  # Forwards SIGTERM to the app, which as PID 1 would otherwise be exempt from
  # the default action and sit out the ten seconds until Docker kills it.
  init: true
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health"]
    interval: 2s
    timeout: 2s
    retries: 30
    start_period: 5s

x-proxy: &proxy
  image: naru-pub-proxy:current
  pull_policy: never
  restart: unless-stopped
  init: true
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/5000'"]
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 5s

services:
  gateway:
    image: nginx:1.30.4-alpine
    container_name: naru-pub-gateway
    restart: always
    ports:
      - "40000:3000"
      - "40001:5000"
    volumes:
      - ./.deploy-state/nginx:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 3s
      retries: 3

  control-plane-blue:
    <<: *control-plane

  control-plane-green:
    <<: *control-plane

  proxy-blue:
    <<: *proxy

  proxy-green:
    <<: *proxy

  cron:
    image: naru-pub-control-plane:current
    pull_policy: never
    restart: always
    # Not `pnpm run cron`, which is pnpm, then the tsx CLI, then node: three
    # resident processes where one does the work.
    command: ["node", "--import", "tsx", "src/cli/cron.ts"]
    init: true
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    image: naru-pub-control-plane:current
    pull_policy: never
    restart: always
    # Not `pnpm run worker`, which is pnpm, then the tsx CLI, then node: three
    # resident processes where one does the work.
    command: ["node", "--import", "tsx", "src/cli/worker.ts"]
    init: true
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
