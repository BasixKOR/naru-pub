name: main
on:
  push:
    branches:
      - main

jobs:
  image-control-plane:
    defaults:
      run:
        working-directory: control-plane
    permissions:
      contents: read
      packages: write
      attestations: write
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: arch
        run: echo arch=arm64 >> "$GITHUB_OUTPUT"
      # Two targets of one Dockerfile: the Next.js standalone server, and the
      # image cron, worker and migrations run from. The second build reuses the
      # first's dependency install from this builder's cache.
      - uses: docker/build-push-action@v6
        with:
          context: control-plane
          target: web
          pull: "true"
          push: "true"
          no-cache: "false"
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}-control-plane:git-${{ github.sha }}-${{ steps.arch.outputs.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-control-plane:build-cache-${{ steps.arch.outputs.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-control-plane:build-cache-${{ steps.arch.outputs.arch }},mode=max
          provenance: false
      - uses: docker/build-push-action@v6
        with:
          context: control-plane
          target: jobs
          pull: "true"
          push: "true"
          no-cache: "false"
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}-control-plane-jobs:git-${{ github.sha }}-${{ steps.arch.outputs.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-control-plane-jobs:build-cache-${{ steps.arch.outputs.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-control-plane-jobs:build-cache-${{ steps.arch.outputs.arch }},mode=max
          provenance: false

  image-proxy:
    defaults:
      run:
        working-directory: proxy
    permissions:
      contents: read
      packages: write
      attestations: write
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: arch
        run: echo arch=arm64 >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: proxy
          pull: "true"
          push: "true"
          no-cache: "false"
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}-proxy:git-${{ github.sha }}-${{ steps.arch.outputs.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-proxy:build-cache-${{ steps.arch.outputs.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-proxy:build-cache-${{ steps.arch.outputs.arch }},mode=max
          provenance: false
  # Runs the images just pushed as a deploy would. deploy.sh deploys only a
  # commit whose whole run succeeded, so a failure here keeps it off the server.
  smoke-test-control-plane:
    needs: image-control-plane
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: |
          image=ghcr.io/${{ github.repository }}-control-plane
          tag=git-${{ github.sha }}-arm64
          docker pull --quiet "$image:$tag"
          docker pull --quiet "$image-jobs:$tag"
          control-plane/scripts/smoke-test-images.sh "$image:$tag" "$image-jobs:$tag"
